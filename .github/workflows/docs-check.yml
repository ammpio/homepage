name: Docs check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Fails on invalid frontmatter, duplicate page names, broken doc links or missing images.
      - name: Docs tests
        run: bunx vitest run src/lib/docs.test.ts
      - name: Build
        run: bunx vite build
